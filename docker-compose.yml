services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: game
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: pokemmo
    # Only this PC can reach the database (the game server); never expose it to players.
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]
volumes:
  pgdata:
